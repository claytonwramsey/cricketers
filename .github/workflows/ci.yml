name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # filter submodules to just the ones that we will use
      - name: Checkout submodules
        run: |
          git submodule update --init --depth 1 --jobs 8
          # Only the Boost libraries cricket-sys's vendored dependency tree actually touches --
          # regenerate by running a full local build and listing
          # target/*/build/cricket-sys-*/out/build/boost/build/libs/*/.
          git -C crates/cricket-sys/vendor/boost submodule update --init --depth 1 --jobs 8 -- \
            tools/cmake \
            libs/algorithm libs/align libs/any libs/array libs/asio libs/assert libs/atomic \
            libs/bimap libs/bind libs/chrono libs/concept_check libs/config libs/container \
            libs/container_hash libs/context libs/conversion libs/core libs/coroutine \
            libs/date_time libs/describe libs/detail libs/dynamic_bitset libs/endian \
            libs/exception libs/filesystem libs/foreach libs/function libs/function_types \
            libs/functional libs/fusion libs/graph libs/headers libs/integer libs/intrusive \
            libs/io libs/iostreams libs/iterator libs/lambda libs/lexical_cast libs/logic \
            libs/math libs/move libs/mp11 libs/mpl libs/multi_index libs/multiprecision \
            libs/numeric/conversion libs/optional libs/parameter libs/phoenix libs/pool \
            libs/predef libs/preprocessor libs/property_map libs/property_tree libs/proto \
            libs/random libs/range libs/ratio libs/regex libs/scope libs/serialization \
            libs/smart_ptr libs/spirit libs/static_assert libs/system libs/thread \
            libs/throw_exception libs/tokenizer libs/tti libs/tuple libs/type_index \
            libs/type_traits libs/typeof libs/unordered libs/utility libs/variant \
            libs/variant2 libs/winapi libs/xpressive
          git -C crates/cricket-sys/vendor/pinocchio submodule update --init --depth 1 cmake
          git -C crates/cricket-sys/vendor/coal submodule update --init --depth 1 cmake

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A separate, dedicated cache for just cricket-sys's vendored C++ build output.
      - name: Cache cricket-sys vendored build
        uses: actions/cache@v4
        with:
          path: target/*/build/cricket-sys-*/out
          key: cricket-sys-vendor-${{ hashFiles('crates/cricket-sys/build.rs', 'crates/cricket-sys/patches/**', '.gitmodules') }}

      # Cache restore preserves the original mtimes from whenever the cache was saved, but
      # the checkout above always stamps vendored sources with the current time -- so without
      # this, CMake/Make sees "sources newer than cached objects" and recompiles everything on
      # every run regardless of what's cached.
      - name: Fix cached build timestamps
        run: |
          shopt -s nullglob
          dirs=(target/*/build/cricket-sys-*/out)
          if [ ${#dirs[@]} -gt 0 ]; then
            find "${dirs[@]}" -exec touch {} +
          fi

      - name: Build
        run: cargo build --workspace --verbose

      - name: Build tests
        run: cargo test --workspace --verbose --no-run

      - name: Test
        run: cargo test --workspace --verbose
